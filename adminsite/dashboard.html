<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Axios for making HTTP requests -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
    
    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-6xl bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Admin Authentication Dashboard</h1>
        
        <div class="mb-6 flex">
            <input 
                type="text" 
                id="aadharInput" 
                placeholder="Enter Aadhar Number" 
                class="flex-grow p-3 border-2 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                maxlength="12"
            >
            <button 
                id="searchBtn" 
                class="bg-blue-600 text-white px-6 py-3 rounded-r-lg hover:bg-blue-700 transition duration-300 font-semibold"
            >
                Search Logs
            </button>
        </div>

        <div class="flex mb-6 space-x-2">
            <button 
                id="logsTab" 
                class="flex-1 p-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-300 font-semibold tab-active"
            >
                Authentication Logs
            </button>
            <button 
                id="statsTab" 
                class="flex-1 p-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-300 font-semibold"
            >
                Authentication Statistics
            </button>
        </div>

        <div id="errorMessage" class="text-red-500 mb-4 text-center hidden"></div>

        <div id="logsContainer" class="space-y-4">
            <!-- User Authentication Logs -->
        </div>

        <div id="statsContainer" class="hidden space-y-6">
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-blue-50 p-5 rounded-lg shadow-md text-center">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Total Attempts</h3>
                    <p id="totalAttempts" class="text-3xl font-bold text-blue-600">-</p>
                </div>
                <div class="bg-green-50 p-5 rounded-lg shadow-md text-center">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Successful Auth</h3>
                    <p id="successfulAuth" class="text-3xl font-bold text-green-600">-</p>
                </div>
                <div class="bg-red-50 p-5 rounded-lg shadow-md text-center">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Failed Auth</h3>
                    <p id="failedAuth" class="text-3xl font-bold text-red-600">-</p>
                </div>
                <div class="bg-purple-50 p-5 rounded-lg shadow-md text-center">
                    <h3 class="font-bold text-lg text-gray-800 mb-2">Success Rate</h3>
                    <p id="successRate" class="text-3xl font-bold text-purple-600">-</p>
                </div>
            </div>

            <div class="bg-gray-50 p-6 rounded-lg shadow-md">
                <h3 class="font-bold text-xl text-gray-800 mb-4">24-Hour Login Distribution</h3>
                <canvas id="hourlyLoginChart" class="w-full h-80"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Tab and Event Listeners
        const logsTab = document.getElementById('logsTab');
        const statsTab = document.getElementById('statsTab');
        const logsContainer = document.getElementById('logsContainer');
        const statsContainer = document.getElementById('statsContainer');
        const hourlyLoginChart = document.getElementById('hourlyLoginChart');

        // Tab Switching Handlers
        logsTab.addEventListener('click', () => {
            logsTab.classList.add('bg-blue-500', 'text-white');
            logsTab.classList.remove('bg-gray-200', 'text-gray-700');
            statsTab.classList.remove('bg-blue-500', 'text-white');
            statsTab.classList.add('bg-gray-200', 'text-gray-700');
            
            logsContainer.classList.remove('hidden');
            statsContainer.classList.add('hidden');
        });

        // Wait for DOM and all scripts to load
        document.addEventListener('DOMContentLoaded', () => {
            // Stats Tab Event Listener
            statsTab.addEventListener('click', async () => {
                // Tab styling
                statsTab.classList.add('bg-blue-500', 'text-white');
                statsTab.classList.remove('bg-gray-200', 'text-gray-700');
                logsTab.classList.remove('bg-blue-500', 'text-white');
                logsTab.classList.add('bg-gray-200', 'text-gray-700');
                
                logsContainer.classList.add('hidden');
                statsContainer.classList.remove('hidden');

                try {
                    // Parallel API calls
                    const [statsResponse, hourlyResponse] = await Promise.all([
                        axios.get('http://localhost:3000/api/auth-stats'),
                        axios.get('http://localhost:3000/api/hourly-logins')
                    ]);

                    const stats = statsResponse.data;
                    const hourlyData = hourlyResponse.data;

                    // Update statistics
                    document.getElementById('totalAttempts').textContent = stats.totalAttempts;
                    document.getElementById('successfulAuth').textContent = stats.successfulAuth;
                    document.getElementById('failedAuth').textContent = stats.failedAuth;
                    document.getElementById('successRate').textContent = `${stats.successRate}%`;

                    // Render chart using Chart.js
                    const hours = hourlyData.map(item => item.hour);
                    const successfulLogins = hourlyData.map(item => item.successfulLogins);

                    new Chart(hourlyLoginChart, {
                        type: 'bar',
                        data: {
                            labels: hours,
                            datasets: [{
                                label: 'Successful Logins',
                                data: successfulLogins,
                                backgroundColor: '#3B82F6',
                                borderColor: '#3B82F6',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Hour of Day'
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'Successful Logins'
                                    },
                                    beginAtZero: true
                                }
                            }
                        }
                    });

                } catch (error) {
                    console.error('Error fetching stats:', error);
                    // Error handling for stats display
                    ['totalAttempts', 'successfulAuth', 'failedAuth', 'successRate'].forEach(id => {
                        document.getElementById(id).textContent = 'Error';
                    });
                }
            });
        });

        // Search Button Event Handler
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const aadharInput = document.getElementById('aadharInput');
            const errorMessage = document.getElementById('errorMessage');

            // Reset previous states
            errorMessage.classList.add('hidden');
            logsContainer.innerHTML = '';

            const aadharNumber = aadharInput.value.trim();

            // Basic validation
            if (aadharNumber.length !== 12 || !/^\d+$/.test(aadharNumber)) {
                errorMessage.textContent = 'Please enter a valid 12-digit Aadhar number';
                errorMessage.classList.remove('hidden');
                return;
            }

            try {
                const response = await axios.get(`http://localhost:3000/api/user/user-logs/${aadharNumber}`);
                const logs = response.data.logs;

                if (logs.length === 0) {
                    logsContainer.innerHTML = `
                        <div class="text-center text-gray-500 p-6 bg-gray-50 rounded-lg">
                            No authentication logs found for this Aadhar number
                        </div>
                    `;
                    return;
                }

                logs.forEach(log => {
                    const logCard = document.createElement('div');
                    logCard.className = 'bg-gray-50 p-6 rounded-lg shadow-md flex items-start space-x-4';
                    
                    // Format timestamp
                    const formattedDate = new Date(log.Timestamp).toLocaleString('en-IN', {
                        dateStyle: 'full',
                        timeStyle: 'long',
                        timeZone: 'Asia/Kolkata'
                    });

                    logCard.innerHTML = `
                        <div class="flex-shrink-0">
                            <img 
                                src="data:image/jpeg;base64,${log.Image}" 
                                class="w-32 h-32 object-cover rounded-lg" 
                                alt="Log Image"
                                onerror="this.style.display='none'"
                            >
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-xl text-gray-800">${log.Name}</h3>
                            <p class="text-gray-600 mb-2">${log.Description}</p>
                            <div class="text-sm text-gray-500 space-y-1">
                                <p>Timestamp: ${formattedDate}</p>
                                <p>IP Address: ${log.IPAddress}</p>
                            </div>
                        </div>
                    `;

                    logsContainer.appendChild(logCard);
                });
            } catch (error) {
                errorMessage.textContent = 
                    error.response?.data?.message || 
                    'An error occurred while fetching logs';
                errorMessage.classList.remove('hidden');
                console.error(error);
            }
        });
    </script>
</body>
</html>
