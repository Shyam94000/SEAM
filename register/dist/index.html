<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .registration-card {
            width: 500px;
            padding: 30px;
            border-radius: 16px;
            background: linear-gradient(180deg, white 20%, rgba(255, 190, 50, 0.8) 65%, rgba(10, 190, 40, 0.7) 100%);
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            color: #4caf50;
            font-weight: bold;
        }

        p {
            color: #555;
            font-style: italic;
            margin: 10px 0;
        }

        form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .footer-text {
            color: #2234a8;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .footer-text span {
            color: red;
        }
    </style>
</head>
<body>
    <div class="registration-card">
        <h2>User Registration</h2>
        <p>Secure registration via SEAM</p>

        <form onsubmit="submitForm(event)" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="aadharNumber">Aadhar Number:</label>
                <input type="text" id="aadharNumber" name="aadharNumber" required>
            </div>

            <div class="form-group">
                <label for="image">Face Image:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="footer-text">
            मेरा <span>आधार</span>, मेरी पहचान
        </div>
    </div>

    <script>
        async function submitForm(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            try {
                const response = await fetch('https://sihseam2024mainbackend.azurewebsites.net/api/user/register', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Unexpected response: ${text}`);
                }

                const result = await response.json();

                if (response.ok) {
                    alert('Registration Successful: ' + result.message);
                    form.reset();
                } else {
                    alert('Registration Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during registration: ' + error.message);
            }
        }
    </script>
</body>
</html>
